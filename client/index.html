    <style>
      html, body { margin: 0; padding: 0; background: #0f0f0f; color: #e5e5e5; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #0f0f0f;
        z-index: 9999; gap: 16px;
      }
      #splash svg { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #splash p { font-family: sans-serif; font-size: 13px; color: #71717a; margin: 0; }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      <p>Carregando...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var splash = document.getElementById('splash');
            if (splash) splash.style.display = 'none';
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
      });
    </script>
  </body>
